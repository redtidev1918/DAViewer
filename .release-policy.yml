{
  "kind": "flutter",
  "versioning": {
    "mode": "release-please"
  },
  "build": {
    "test": "flutter pub get && flutter analyze && dart format --output=none --set-exit-if-changed lib test && flutter test",
    "flutter_version": "3.47.1",
    "matrix": [
      {
        "runner": "ubuntu-latest",
        "command": "scripts/build-release"
      },
      {
        "runner": "macos-latest",
        "command": "scripts/build-release"
      },
      {
        "runner": "windows-2022",
        "command": "scripts/build-release"
      }
    ]
  },
  "assets": {
    "required": [
      "DAViewer-v*.apk",
      "DAViewer-v*macos-unsigned-preview.zip",
      "DAViewer-v*windows.zip"
    ],
    "optional": []
  },
  "registries": {
    "github": {
      "required": true
    }
  },
  "release": {
    "notes": {
      "language": "zh"
    },
    "post_publish": "python3 .github/scripts/update_download_page.py && git config user.name github-actions[bot] && git config user.email 41898282+github-actions[bot]@users.noreply.github.com && git add docs/ && (git diff --cached --quiet || (git commit -m 'docs: update release download page' && git push && gh workflow run static.yml --ref main))"
  },
  "retention": {
    "stable": 1,
    "prerelease": 1,
    "failed_draft": 2,
    "pruneStable": true
  },
  "checksums": true,
  "sbom": false,
  "repository": {
    "git": {
      "productionOperations": {
        "base": "default",
        "branches": [
          "chore/cutover-*",
          "ops/*",
          "release/*",
          "hotfix/*"
        ],
        "requireLatestBase": true
      }
    }
  }
}
