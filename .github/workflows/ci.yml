name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if flutter pub get; then exit 0; fi
            echo "::warning::flutter pub get failed (attempt $attempt/5), retrying in 15s"
            sleep 15
          done
          exit 1
      - run: flutter analyze
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter test
      - name: Chinese release notes for current manifest version
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re

          manifest = json.loads(
              pathlib.Path(".release-please-manifest.json").read_text(encoding="utf-8")
          )
          version = manifest["."]
          notes = pathlib.Path(f".github/release-notes/{version}.md")
          if not notes.exists():
              print(f"missing Chinese release notes: {notes}")
              raise SystemExit(1)
          text = notes.read_text(encoding="utf-8")
          if "本次更新" not in text or not re.search(r"[\u4e00-\u9fff]", text):
              print(f"release notes must contain Chinese and a 本次更新 section: {notes}")
              raise SystemExit(1)
          print(f"Chinese release notes OK for {version}")
          PY
      - name: Canonical release asset naming
        shell: bash
        run: |
          # Exactly one shipped name per platform, always the `v`-prefixed form.
          # A second, v-less convention does not overwrite anything: release
          # uploads are additive, so it surfaces as a duplicate pair on the
          # release (v0.2.184 carries both `DAViewer-0.2.184.apk` and
          # `DAViewer-v0.2.184.apk`). Guard the producer and the collector.
          set -euo pipefail
          if grep -q 'DAViewer-\$RELEASE_VERSION' scripts/build-release; then
            echo "::error::scripts/build-release writes a non-canonical (v-less) asset name"
            exit 1
          fi
          grep -q 'DAViewer-v\$RELEASE_VERSION' scripts/build-release || {
            echo "::error::scripts/build-release does not write the canonical v-prefixed names"
            exit 1
          }
          grep -q 'DAViewer-v\*' .release-policy.yml || {
            echo "::error::.release-policy.yml does not require canonical v-prefixed assets"
            exit 1
          }
          echo "canonical release asset naming OK"
