name: daviewer
description: "DAViewer — an open-source third-party DeviantArt client built on DAKit."
publish_to: 'none'
version: 0.5.13+225

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  chewie: ^1.17.2
  crypto: ^3.0.3
  cupertino_icons: ^1.0.8
  dakit_api: ^1.1.1
  dakit_core: ^1.1.0
  dakit_web: ^0.2.5
  dakit_flutter: ^1.0.0
  dio: ^5.11.1
  flutter_cache_manager: ^3.4.5
  flutter_html: ^3.0.0
  flutter_inappwebview: 6.1.5
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^10.3.1
  go_router: ^17.5.0
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.3

# flutter_html 3.0.0 imports html's internal query-selector API, whose
# `matches` signature changed to SelectorGroup in html 0.15.7 and no longer
# accepts the String it passes. Pinning keeps a fresh resolution (which a
# changed PUB_HOSTED_URL forces) on the version the committed lock uses.
dependency_overrides:
  html: 0.15.6
  # Joint candidate only; replace with verified published SDK versions before release.
  dakit_core:
    git:
      url: https://github.com/redtidev1918/DAKit.git
      ref: bbf52bdd737233c965bf8531db174651ea7cec0f
      path: packages/dakit_core
  dakit_api:
    git:
      url: https://github.com/redtidev1918/DAKit.git
      ref: bbf52bdd737233c965bf8531db174651ea7cec0f
      path: packages/dakit_api
  dakit_web:
    git:
      url: https://github.com/redtidev1918/DAKit.git
      ref: bbf52bdd737233c965bf8531db174651ea7cec0f
      path: packages/dakit_web
  dakit_flutter:
    git:
      url: https://github.com/redtidev1918/DAKit.git
      ref: bbf52bdd737233c965bf8531db174651ea7cec0f
      path: packages/dakit_flutter

flutter:
  uses-material-design: true

# App icon generation: `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
  remove_alpha_ios: true
